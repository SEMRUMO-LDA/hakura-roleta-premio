<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roleta de Prémios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html, body { margin: 0; }
/* Layout: one centred stage — wheel on the left, prize card on the right; stacks on phones */
:root {
  /* single warm look on the wood panel background */
  --bg: #c48a55;
  --surface: rgba(250, 244, 234, .92);
  --fg: #2b1a10;
  --muted: #6e5140;
  --line: rgba(90, 55, 30, .18);
  --accent: #33503f;
  --accent-ink: #fbf6ee;
  --gold: #d6ad5c;
  --s1: #33503f; --s2: #f4ead8; --s3: #8fa88a; --s4: #d6ad5c; --s5: #4a2e20; --s6: #e8c4b4;
  --display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg) url("img/hakura_Fundo_Madeira.jpg") center / cover fixed no-repeat; min-height: 100%; color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 48px; }
header { display: grid; gap: 4px; margin: 0 auto 28px; text-align: center; background: var(--surface); border-radius: 18px; padding: 18px 28px; width: fit-content; max-width: 100%; box-shadow: 0 10px 30px -18px rgba(40,20,5,.6); }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 6vw, 52px); line-height: 1.05; margin: 0; text-wrap: balance; }
.stage { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 40px; align-items: center; }
@media (max-width: 820px) { .stage { grid-template-columns: 1fr; gap: 28px; } }

.wheel-box { position: relative; width: 100%; max-width: 520px; aspect-ratio: 1; margin: 0 auto; }
#wheel { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 24px 60px -18px rgba(40,20,5,.7); }
.pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 36px; height: 46px; z-index: 2; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
.hub { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%,-50%); width: 22%; aspect-ratio: 1; border-radius: 50%;
  background: var(--surface); border: 4px solid var(--gold); display: grid; place-items: center; z-index: 2;
  font-family: var(--display); font-size: clamp(15px, 3vw, 22px); color: var(--fg); cursor: pointer; transition: transform .15s; }
.hub:hover { transform: translate(-50%,-50%) scale(1.04); }
.hub:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.panel { display: grid; gap: 20px; min-width: 0; }
.result { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; min-height: 180px; display: grid; gap: 8px; align-content: center; }
.result .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.result .prize { font-family: var(--display); font-size: clamp(26px, 4vw, 34px); line-height: 1.15; text-wrap: balance; }
.result .sub { color: var(--muted); }
.result.win { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.result.win .prize { animation: pop .5s ease-out; }
@keyframes pop { from { transform: scale(.9); opacity: .3 } to { transform: none; opacity: 1 } }

.spin { appearance: none; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 700 18px/1 var(--body);
  padding: 18px 28px; cursor: pointer; letter-spacing: .02em; transition: transform .12s, opacity .2s; }
.spin:hover:not(:disabled) { transform: translateY(-1px); }
.spin:disabled { opacity: .55; cursor: default; }

details { backdrop-filter: blur(6px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }
summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.odds { display: grid; gap: 10px; margin-top: 14px; }
.odd { display: grid; grid-template-columns: 14px minmax(0,1fr) 70px 52px; gap: 10px; align-items: center; font-size: 14px; }
.dot { width: 14px; height: 14px; border-radius: 50%; }
.odd input { width: 70px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--fg); font: inherit; font-variant-numeric: tabular-nums; }
.pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.ghost { appearance: none; background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 7px 12px; font: 500 13px var(--body); cursor: pointer; }
.history { font-size: 14px; color: var(--muted); background: var(--surface); border-radius: 14px; padding: 14px 18px; }
.history ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 2px; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .result.win .prize { animation: none; } }
</style>
</head>
<body>

<canvas id="confetti"></canvas>
<div class="wrap">
  <header>
    <span class="eyebrow">Gira e ganha</span>
    <h1>Roleta de Prémios</h1>
  </header>

  <div class="stage">
    <div class="wheel-box">
      <svg class="pointer" viewBox="0 0 36 46" aria-hidden="true"><path d="M18 46 L2 8 A16 16 0 0 1 34 8 Z" fill="var(--gold)"/><circle cx="18" cy="14" r="6" fill="var(--surface)"/></svg>
      <canvas id="wheel" width="1040" height="1040" aria-label="Roleta com 6 prémios" role="img"></canvas>
      <div class="hub" id="hub" role="button" tabindex="0" aria-label="Girar a roleta">Girar</div>
    </div>

    <div class="panel">
      <div class="result" id="result" aria-live="polite">
        <span class="label">O teu prémio</span>
        <span class="prize" id="prize">Pronto para girar?</span>
        <span class="sub" id="sub">Carrega no botão e vê onde a roleta pára.</span>
      </div>
      <button class="spin" id="spin">Girar a roleta</button>

      <details id="settings">
        <summary>Probabilidades (só para a equipa)</summary>
        <div class="odds" id="odds"></div>
        <p class="hint">As fatias têm todas o mesmo tamanho; o peso define a probabilidade real de cada prémio. Fica guardado neste navegador.</p>
        <div class="row"><button class="ghost" id="reset">Repor valores</button></div>
      </details>

      <div class="history" id="history" hidden>
        <strong>Últimos prémios</strong>
        <ol id="histList"></ol>
      </div>
    </div>
  </div>
</div>

<script>
const PRIZES = [
  { short: ["20%", "HIFU"],               full: "20% em tratamento HIFU",                          sub: "Desconto num tratamento HIFU.",                        w: 19 },
  { short: ["Vale", "10€"],               full: "Vale de 10€",                                     sub: "Para usar em qualquer especialidade.",                 w: 19 },
  { short: ["15%", "Fisioterapia"],       full: "15% numa sessão de fisioterapia",                 sub: "Desconto numa sessão de fisioterapia.",                w: 19 },
  { short: ["Massagem", "relaxamento"],   full: "Massagem de relaxamento (50 min)",                sub: "Oferta de uma massagem de relaxamento de 50 minutos.", w: 5  },
  { short: ["25%", "Pilates"],            full: "25% em aula de pilates",                          sub: "Desconto numa aula de pilates.",                       w: 19 },
  { short: ["30%", "Massagens", "terapêuticas"], full: "30% em massagens terapêuticas",            sub: "Desconto em massagens terapêuticas.",                  w: 19 },
];
const DEFAULT_W = PRIZES.map(p => p.w);
const KEY = "roleta-pesos-v1";
try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s) && s.length === PRIZES.length) s.forEach((v,i)=> PRIZES[i].w = Math.max(0, +v || 0)); } catch (e) {}

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COLORS = ["--s1","--s2","--s3","--s4","--s5","--s6"];
const INK = ["#fbf6ee","#33503f","#1d2b20","#2b1a10","#f4ead8","#4a2e20"];

const cv = document.getElementById("wheel"), ctx = cv.getContext("2d");
const N = PRIZES.length, SEG = Math.PI * 2 / N;
let rot = 0, spinning = false;

function draw() {
  const W = cv.width, R = W / 2;
  ctx.clearRect(0,0,W,W);
  ctx.save(); ctx.translate(R,R); ctx.rotate(rot);
  for (let i = 0; i < N; i++) {
    const a0 = -Math.PI/2 + i*SEG - SEG/2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-14,a0,a0+SEG); ctx.closePath();
    ctx.fillStyle = css(COLORS[i]); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 4; ctx.stroke();
    // label
    ctx.save(); ctx.rotate(a0 + SEG/2); ctx.translate(R*0.62, 0); ctx.rotate(Math.PI/2);
    ctx.fillStyle = INK[i]; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const lines = PRIZES[i].short;
    lines.forEach((t, k) => {
      const big = /%|€/.test(t);
      ctx.font = big ? `400 ${W*0.075}px "DM Serif Display", Georgia, serif` : `700 ${W*0.034}px Figtree, system-ui, sans-serif`;
      const y = (k - (lines.length-1)/2) * W*0.06;
      ctx.fillText(t, 0, y);
    });
    if (i === 3) { // star on the special prize
      ctx.font = `${W*0.04}px serif`; ctx.fillText("★", 0, -W*0.085);
    }
    ctx.restore();
  }
  ctx.restore();
  // rim
  ctx.beginPath(); ctx.arc(R,R,R-7,0,Math.PI*2); ctx.lineWidth = 14; ctx.strokeStyle = css("--gold"); ctx.stroke();
  for (let i = 0; i < N*3; i++) {
    const a = rot + i * SEG/3 - Math.PI/2 - SEG/2;
    ctx.beginPath(); ctx.arc(R + Math.cos(a)*(R-7), R + Math.sin(a)*(R-7), 5, 0, Math.PI*2);
    ctx.fillStyle = "#fff8e6"; ctx.fill();
  }
}

function pick() {
  const total = PRIZES.reduce((s,p)=>s+p.w,0);
  if (total <= 0) return Math.floor(Math.random()*N);
  let r = Math.random()*total;
  for (let i = 0; i < N; i++) { r -= PRIZES[i].w; if (r < 0) return i; }
  return N-1;
}

// audio tick
let actx = null;
function tick() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 1400; o.type = "square"; g.gain.value = 0.04;
    o.connect(g); g.connect(actx.destination);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.04);
    o.start(); o.stop(actx.currentTime + 0.05);
  } catch (e) {}
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function spin() {
  if (spinning) return;
  spinning = true; document.getElementById("spin").disabled = true;
  const res = document.getElementById("result"); res.classList.remove("win");
  document.getElementById("prize").textContent = "A girar…";
  document.getElementById("sub").textContent = "Boa sorte!";
  const win = pick();
  // segment i is centred at angle i*SEG (clockwise from top) when rot = 0; pointer at top
  const jitter = (Math.random() - 0.5) * SEG * 0.7;
  const current = ((rot % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  let target = (Math.PI*2 - win*SEG - jitter) % (Math.PI*2);
  let delta = target - current; if (delta < 0) delta += Math.PI*2;
  delta += Math.PI*2 * (reduce ? 1 : 6);
  const start = rot, dur = reduce ? 1200 : 5600, t0 = performance.now();
  let lastSeg = Math.floor((rot + SEG/2) / SEG);
  function frame(now) {
    const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 4);
    rot = start + delta * e; draw();
    const seg = Math.floor((rot + SEG/2) / SEG);
    if (seg !== lastSeg) { lastSeg = seg; tick(); }
    if (t < 1) requestAnimationFrame(frame); else done(win);
  }
  requestAnimationFrame(frame);
}

function done(i) {
  spinning = false; document.getElementById("spin").disabled = false;
  const p = PRIZES[i], res = document.getElementById("result");
  document.getElementById("prize").textContent = p.full;
  document.getElementById("sub").textContent = p.sub;
  void res.offsetWidth; res.classList.add("win");
  const li = document.createElement("li"); li.textContent = p.full;
  const ol = document.getElementById("histList"); ol.prepend(li);
  while (ol.children.length > 8) ol.lastChild.remove();
  document.getElementById("history").hidden = false;
  if (!reduce) confetti(i === 3 ? 260 : 120);
}

// confetti
const cf = document.getElementById("confetti"), cc = cf.getContext("2d");
let bits = [];
function confetti(n) {
  cf.width = innerWidth; cf.height = innerHeight;
  const cols = COLORS.map(css).concat([css("--gold")]);
  for (let k = 0; k < n; k++) bits.push({ x: innerWidth/2 + (Math.random()-.5)*innerWidth*0.4, y: innerHeight*0.35,
    vx: (Math.random()-.5)*14, vy: -Math.random()*14-4, r: Math.random()*Math.PI, vr: (Math.random()-.5)*.3,
    s: 6+Math.random()*6, c: cols[k % cols.length], life: 0 });
  if (bits.length === n) requestAnimationFrame(fall);
}
function fall() {
  cc.clearRect(0,0,cf.width,cf.height);
  bits = bits.filter(b => b.y < cf.height + 20 && b.life < 400);
  bits.forEach(b => { b.vy += .35; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++;
    cc.save(); cc.translate(b.x,b.y); cc.rotate(b.r); cc.fillStyle = b.c; cc.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); cc.restore(); });
  if (bits.length) requestAnimationFrame(fall); else cc.clearRect(0,0,cf.width,cf.height);
}

// odds panel
function renderOdds() {
  const box = document.getElementById("odds"), total = PRIZES.reduce((s,p)=>s+p.w,0) || 1;
  box.innerHTML = "";
  PRIZES.forEach((p,i) => {
    const row = document.createElement("div"); row.className = "odd";
    row.innerHTML = `<span class="dot" style="background:var(${COLORS[i]})"></span><span>${p.full}</span>
      <input id="w${i}" type="number" min="0" step="1" value="${p.w}" aria-label="Peso de ${p.full}"><span class="pct">${(p.w/total*100).toFixed(1)}%</span>`;
    row.querySelector("input").addEventListener("input", ev => {
      PRIZES[i].w = Math.max(0, +ev.target.value || 0); save(); updatePct();
    });
    box.appendChild(row);
  });
}
function updatePct() {
  const total = PRIZES.reduce((s,p)=>s+p.w,0) || 1;
  document.querySelectorAll(".odd .pct").forEach((el,i)=> el.textContent = (PRIZES[i].w/total*100).toFixed(1)+"%");
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(PRIZES.map(p=>p.w))); } catch (e) {} }
document.getElementById("reset").onclick = () => { DEFAULT_W.forEach((w,i)=>PRIZES[i].w=w); save(); renderOdds(); };

document.getElementById("spin").onclick = spin;
const hub = document.getElementById("hub");
hub.onclick = spin; hub.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); spin(); } };

renderOdds();
draw();
if (document.fonts) document.fonts.ready.then(draw);
</script>
</body>
</html>
